apiVersion: 1

datasources:
  - name: Loki
    uid: rsc-loki
    type: loki
    access: proxy
    url: http://rsc-loki:3100
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 5s

  - name: Coordinator API
    uid: rsc-coordinator-api
    type: yesoreyeram-infinity-datasource
    access: proxy
    url: http://rsc-coordinator:8080
    basicAuth: true
    basicAuthUser: ${COORDINATOR_API_USERNAME}
    editable: true
    jsonData:
      auth_method: basicAuth
      allowedHosts:
        - http://rsc-coordinator:8080
      timeoutInSeconds: 10
    secureJsonData:
      basicAuthPassword: ${COORDINATOR_API_PASSWORD}
